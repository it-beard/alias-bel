name: Праверкі

# Агульныя праверкі, аднолькавыя для CI (кожны pull request) і Deploy (пуш у main).
# Каб не трымаць той самы спіс крокаў у двух файлах, абодва выклікаюць гэты праз `uses:`.
#
# Дазволы тут наўмысна не абвяшчаюцца: iх можна толькі звужаць, не пашыраць,
# таму workflow пераймае іх ад таго, хто яго выклікаў.
on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Ці выкласці сабраны dist/ як артэфакт для GitHub Pages.
        type: boolean
        default: false

jobs:
  check:
    name: Лінтар, тэсты, зборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Атрымаць код
        uses: actions/checkout@v7

      - name: Наладзіць Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Усталяваць залежнасці
        run: npm ci

      - name: Лінтар
        run: npm run lint

      - name: Тэсты
        run: npm test

      - name: Зборка
        run: npm run build

      # Vite капіюе public/CNAME у dist/, таму ўласны дамен едзе разам з артэфактам.
      - name: Выкласці dist/ для Pages
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
