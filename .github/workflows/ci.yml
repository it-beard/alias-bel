name: CI

# Праверкі для кожнага pull request, у тым ліку ад Dependabot.
# Самі крокі жывуць у .github/actions/checks, агульным з Deploy.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Лінтар, тэсты, зборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Атрымаць код
        uses: actions/checkout@v7

      - name: Праверкі
        uses: ./.github/actions/checks
