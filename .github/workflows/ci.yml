name: CI

# Праверкі для кожнага pull request, у тым ліку ад Dependabot.
# Самі крокі жывуць у checks.yml, агульным з Deploy.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Праверкі
    uses: ./.github/workflows/checks.yml
