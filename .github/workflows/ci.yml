name: CI

# Праверкі для кожнага pull request, у тым ліку ад Dependabot.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Лінтар, тэсты, зборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Атрымаць код
        uses: actions/checkout@v7

      - name: Наладзіць Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Усталяваць залежнасці
        run: npm ci

      - name: Лінтар
        run: npm run lint

      - name: Тэсты
        run: npm test

      - name: Зборка
        run: npm run build
