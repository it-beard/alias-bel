name: Праверкі
description: Node.js 24, залежнасці, лінтар, тэсты, зборка — агульныя крокі для CI і Deploy.

# Гэта composite action, а не reusable workflow: файлы з .github/actions/ не трапляюць
# у спіс на ўкладцы Actions, а reusable workflow там паказваўся б асобнай пазіцыяй.
#
# Выклікальнік мусіць спачатку зрабіць actions/checkout — інакш гэтага файла на раннеры
# яшчэ няма, і крок `uses: ./.github/actions/checks` не знойдзе яго.
runs:
  using: composite
  steps:
    - name: Наладзіць Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Усталяваць залежнасці
      run: npm ci
      shell: bash

    - name: Лінтар
      run: npm run lint
      shell: bash

    - name: Тэсты
      run: npm test
      shell: bash

    - name: Зборка
      run: npm run build
      shell: bash
