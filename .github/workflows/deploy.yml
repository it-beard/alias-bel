name: Deploy

# Пры кожным пушы ў main: праверкі, зборка і публікацыя ў GitHub Pages.
# Калі лінтар або тэсты падаюць, сайт не абнаўляецца.
#
# Публікацыя ідзе праз actions/deploy-pages: dist/ едзе артэфактам напрамую ў Pages,
# без прамежкавай галіны gh-pages. Таму тут ужо не трэба `contents: write`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публікацыі ідуць па чарзе, каб дзве адначасовыя не перапісалі адна адну.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  check:
    name: Праверкі
    uses: ./.github/workflows/checks.yml
    with:
      upload-pages-artifact: true

  publish:
    name: Апублікаваць
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Апублікаваць у GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
