# Dependabot штопанядзелка правярае абнаўленні і адкрывае pull request'ы,
# на якіх запускаецца CI (.github/workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Minsk
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      # React і яго тыпы абнаўляюцца разам, у тым ліку мажорныя версіі
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # vitest і @vitest/* спасылаюцца адно на аднаго дакладнымі peer-версіямі
      # (напр. vitest@5 патрабуе роўна @vitest/coverage-v8@5), таму паасобку
      # ламаюць npm ci. Трымаем разам, у тым ліку мажорныя версіі.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      # астатнія дробныя абнаўленні — адным PR; мажорныя прыходзяць паасобку
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Са `/` Dependabot бачыць толькі .github/workflows і action.yml у корані.
    # Composite action у .github/actions/ трэба назваць асобна, інакш экшны
    # ўнутры яго (setup-node) застануцца без абнаўленняў.
    directories:
      - /
      - /.github/actions/checks
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Minsk
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
